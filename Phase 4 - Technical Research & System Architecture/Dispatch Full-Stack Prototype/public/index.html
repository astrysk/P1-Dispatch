function demoLanding(){return `<div class="landing"><header class="landnav"><div class="landlogo"><span class="mark">D</span>Dispatch</div><nav class="landnavlinks"><a href="#how">How it works</a><a href="#portals">Portals</a><a href="#features">Features</a><a class="landbtn" href="#login" data-gologin="business">Sign in</a></nav></header>
<section class="landsection landhero"><div><div class="landeyebrow">For factories and transport teams</div><h1>Know which pickups are confirmed, delayed or need action.</h1><p>Dispatch helps factories plan collections, get clear answers from transporters and act quickly when a pickup is at risk.</p><div class="landactions"><a class="landbtn" href="#login" data-gologin="business">Get started <span style="margin-left:12px">→</span></a><a class="landbtn light" href="#how">See how Dispatch works</a></div><p class="landnote">A simple workspace for business teams, transporters and platform administrators.</p></div><div class="heroart"><div class="heroarttop"><span>DISPATCH WORKFLOW</span><span>● LOCAL DEMO</span></div><h3>Every pickup. One clear status.</h3><div class="flowitem"><span class="flowdot">01</span><div><strong>Plan the pickup</strong><small>Share goods, location and pickup window.</small></div></div><div class="flowitem"><span class="flowdot">02</span><div><strong>Confirm the commitment</strong><small>Know whether the transporter can arrive.</small></div></div><div class="flowitem"><span class="flowdot">03</span><div><strong>Spot risk and recover</strong><small>Act on delays before they become surprises.</small></div></div><div class="flowitem"><span class="flowdot">04</span><div><strong>Record the outcome</strong><small>Learn what was on time, late or missed.</small></div></div></div></section>
<section class="landsection"><div class="sectionhead"><div class="landeyebrow">The problem</div><h2>Know what is happening with every pickup.</h2><p>When a vehicle does not arrive, goods sit and teams lose time chasing updates. Dispatch shows the pickup plan, transporter response and next step in one place.</p></div><div class="painrow"><article class="plaincard"><div class="bigicon">◷</div><h3>Spend less time chasing</h3><p>See pickup details and transporter commitment without searching through scattered messages and calls.</p></article><article class="plaincard"><div class="bigicon">↗</div><h3>See delays sooner</h3><p>Keep an eye on pickups that are awaiting confirmation, at risk or already delayed.</p></article><article class="plaincard"><div class="bigicon">↻</div><h3>Know the next step</h3><p>Record exceptions, open a recovery case and keep the original pickup history visible.</p></article></div></section>
<section class="landsection landmuted" id="how"><div class="sectionhead"><div class="landeyebrow">How it works</div><h2>Plan it. Confirm it. Keep it moving.</h2><p>Everyone can see what is planned, what is confirmed and what needs attention.</p></div><div class="stepsgrid"><article class="stepcard"><div class="stepnum">STEP 01</div><h3>Add a pickup</h3><p>Add the customer, shipment, pickup location and time window.</p></article><article class="stepcard"><div class="stepnum">STEP 02</div><h3>Get confirmation</h3><p>The transporter reviews the assignment and confirms or rejects it.</p></article><article class="stepcard"><div class="stepnum">STEP 03</div><h3>Handle delays</h3><p>Update progress, flag a risk and record recovery actions when plans change.</p></article><article class="stepcard"><div class="stepnum">STEP 04</div><h3>Check the result</h3><p>See completed, late, missed and unresolved outcomes separately.</p></article></div></section>
<section class="landsection" id="portals"><div class="sectionhead"><div class="landeyebrow">Choose your workspace</div><h2>One workspace for each team.</h2><p>Each portal has a focused set of tasks. Choose your workspace to sign in with its own demo account.</p></div><div class="portalslanding"><article class="plaincard"><div class="bigicon">▦</div><h3>Platform Admin</h3><p>Set up organizations, manage local user accounts, maintain transporter records and review platform activity.</p><button class="landbtn" data-gologin="admin">Sign in as Platform Admin →</button><div class="portalhint">For Dispatch platform administrators</div></article><article class="plaincard"><div class="bigicon">▤</div><h3>Business Portal</h3><p>Create pickups, assign transporters, monitor confirmations, manage exceptions and review pickup outcomes.</p><button class="landbtn" data-gologin="business">Sign in to Business →</button><div class="portalhint">For manufacturers and operations teams</div></article><article class="plaincard"><div class="bigicon">⇄</div><h3>Transporter Portal</h3><p>Review assigned pickups, confirm or reject commitments, update progress and report exceptions.</p><button class="landbtn" data-gologin="transporter">Sign in as Transporter →</button><div class="portalhint">For transporter operators</div></article></div></section>
<section class="landsection proofband" id="features"><div><div class="landeyebrow">Built for clear operations</div><h2>See the plan. Know the status. Act on delays.</h2><p>Dispatch focuses on the operational details teams need every day: what was planned, who committed, what changed and how the pickup ended.</p></div><div class="prooflist"><div>✓ Pickup details, schedules and commitments in one view</div><div>✓ At-risk pickups and recovery status</div><div>✓ A history of changes and actions</div><div>✓ Simple reports for known pickup outcomes</div><div>✓ Local data export and restore for this prototype</div></div></section>
<section class="landsection landcta"><div class="landeyebrow">Start with the local demo</div><h2>Try Dispatch with a sample pickup.</h2><p>Use the demo accounts to move between Platform Admin, Business and Transporter views. Changes are saved in this browser only.</p><a class="landbtn" href="#login" data-gologin="business">Choose a portal and sign in →</a></section>
<footer class="landfooter"><div><strong style="color:#243246">Dispatch</strong> · Pickup planning and follow-up</div><div>Local prototype · Data stays in this browser · Not for production credentials</div></footer></div>`}
function loginScreen(){const choices=[{id:'admin',icon:'▦',title:'Platform Admin',desc:'Organizations, users and platform setup'},{id:'business',icon:'▤',title:'Business Portal',desc:'Pickups, commitments and recovery'},{id:'transporter',icon:'⇄',title:'Transporter Portal',desc:'Assignments, progress and exceptions'}];return `<div class="loginpage" id="login"><div class="loginwrap"><div class="loginhead"><div class="landlogo"><span class="mark">D</span>Dispatch</div><button class="secondary" id="backLanding">← Back to overview</button></div><div class="loginlayout"><section class="loginbox"><div class="landeyebrow">Workspace sign in</div><h1>Sign in to your workspace.</h1><p>Choose your team, then use a demo account to try it out.</p><div class="rolechoices">${choices.map(c=>`<button type="button" class="rolechoice ${loginPortal===c.id?'selected':''}" data-loginportal="${c.id}"><span class="bigicon">${c.icon}</span><span><strong>${c.title}</strong><small>${c.desc}</small></span></button>`).join('')}</div></section><section class="loginbox"><h1 id="loginTitle">Sign in to ${choices.find(c=>c.id===loginPortal).title}</h1><p id="loginDesc">Enter your demo login details below.</p>${loginMessage?`<div class="loginerror" role="alert">${esc(loginMessage)}</div>`:''}<form class="loginform" id="loginForm"><div><label for="loginEmail">Email address</label><input id="loginEmail" name="email" type="email" autocomplete="username" placeholder="you@company.com" required></div><div><label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div><div id="orgField" class="${loginPortal==='business'?'':'hidden'}"><label for="loginOrg">Business organization</label><select id="loginOrg" name="orgId">${state.orgs.filter(o=>o.status==='active').map(o=>`<option value="${esc(o.id)}" ${o.id===ORG_DEMO?'selected':''}>${esc(o.name)}${o.id===ORG_DEMO?' (demo)':''}</option>`).join('')}</select><small class="muted">Required for Business access. Choose the organization this account belongs to.</small></div><button class="landbtn" type="submit" style="width:100%;margin-top:3px">Sign in →</button></form><details class="demoaccess" open><summary>Demo login details</summary><p style="font-size:12px;margin:8px 0">These passwords are only for this browser prototype. Choose “Use” to fill the form.</p>${DEMO_CREDENTIALS.filter(c=>loginPortal==='business'?c.portal==='business':c.portal===loginPortal).map(c=>`<div class="credentialrow"><div><strong>${esc(c.label)}</strong><code>${esc(c.email)}</code><code>Password: ${esc(c.password)}</code></div><button type="button" class="copybtn" data-use-demo="${esc(c.email)}">Use</button></div>`).join('')}</details><div class="localwarning">Prototype notice: accounts and passwords are demo-only. Browser localStorage is editable and does not provide real security. Do not use real customer data or production passwords.</div></section></div></div></div>`}
function addRevealEffects(){const targets=document.querySelectorAll('.landing .landsection,.landing .plaincard,.landing .stepcard,.heroart');targets.forEach(el=>el.classList.add('reveal'));if(!('IntersectionObserver' in window)){targets.forEach(el=>el.classList.add('in-view'));return}const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('in-view');observer.unobserve(entry.target)}}),{threshold:.12});targets.forEach(el=>observer.observe(el))}
function showLanding(){document.querySelector('#app').innerHTML=demoLanding();addRevealEffects();document.querySelectorAll('[data-gologin]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();loginPortal=b.dataset.gologin;loginMessage='';showLogin()}));}
function showLogin(){document.querySelector('#app').innerHTML=loginScreen();document.querySelector('#backLanding').onclick=showLanding;document.querySelectorAll('[data-loginportal]').forEach(b=>b.onclick=()=>{loginPortal=b.dataset.loginportal;loginMessage='';showLogin()});document.querySelectorAll('[data-use-demo]').forEach(b=>b.onclick=()=>{const c=DEMO_CREDENTIALS.find(x=>x.email===b.dataset.useDemo);document.querySelector('#loginEmail').value=c.email;document.querySelector('#loginPassword').value=c.password;const o=document.querySelector('#loginOrg');if(o&&c.portal==='business')o.value=state.users.find(u=>u.email===c.email)?.orgId||ORG_DEMO});document.querySelector('#loginForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());const u=state.users.find(x=>x.email.toLowerCase()===d.email.trim().toLowerCase());const portalRoles={admin:['platform_admin'],business:['business_owner','business_operator'],transporter:['transporter_operator']};const demoCred=DEMO_CREDENTIALS.find(c=>c.email.toLowerCase()===d.email.trim().toLowerCase());const validPassword=u?.demoPassword?u.demoPassword===d.password:Boolean(demoCred&&demoCred.password===d.password);if(!u||!u.active||!portalRoles[loginPortal]?.includes(u.role)||!validPassword){loginMessage='The email, password or portal does not match an active account. For demo accounts, use the password shown below.';showLogin();return}if(loginPortal==='business'&&(!d.orgId||u.orgId!==d.orgId)){loginMessage='This account is not assigned to the selected business organization.';showLogin();return}const portal=loginPortal;state.session={userId:u.id,portal,orgId:portal==='business'?d.orgId:(u.orgId||ORG_DEMO)};sessionStorage.setItem('dispatch.local.session',JSON.stringify(state.session));loginMessage='';view='overview';save();render();};}
function logout(){state.session=null;sessionStorage.removeItem('dispatch.local.session');view='overview';loginPortal='business';loginMessage='';render();}

function setPortal(p){state.session.portal=p;const allowed=p==='admin'?['platform_admin']:p==='business'?['business_owner','business_operator']:['transporter_operator'];if(!allowed.includes(user().role)){const fallback=state.users.find(u=>allowed.includes(u.role)&&u.active);if(fallback)state.session.userId=fallback.id;}state.session.orgId=user().orgId||ORG_DEMO;view='overview';search='';filter='all';save();render()}
function navLink(v,label,ico){return `<button class="nav ${view===v?'active':''}" data-view="${v}"><span class="ico">${ico}</span>${label}</button>`}
function header(){return `<header class="top"><div class="brand"><div class="mark">D</div>Dispatch <span class="pill">LOCAL WORKSPACE</span></div><div class="topright"><span class="pill">Browser storage only</span><select id="portalSwitch" aria-label="Switch portal" style="width:auto;max-width:190px"><option value="admin" ${state.session.portal==='admin'?'selected':''}>Platform Admin</option><option value="business" ${state.session.portal==='business'?'selected':''}>Business Portal</option><option value="transporter" ${state.session.portal==='transporter'?'selected':''}>Transporter Portal</option></select><button class="secondary small" id="exportBtn">Export data</button><button class="secondary small" id="logoutBtn">Sign out</button></div></header>`}
function sidebar(){let p=state.session.portal;let items=p==='admin'?[['overview','Overview','▦'],['organizations','Organizations','▣'],['users','Users & access','♙'],['transporters','Transporters','⇄'],['pickups','All pickups','▤'],['audit','Activity log','◷'],['settings','Workspace settings','⚙']]:p==='business'?[['overview','Overview','▦'],['pickups','Pickups','▤'],['recovery','Recovery desk','↻'],['transporters','Transporters','⇄'],['reports','Reports','▥']]:[['overview','Overview','▦'],['my-pickups','Assigned pickups','▤'],['exceptions','Exceptions','⚠']];return `<aside><div class="orglabel">${esc(portalNames[p])}</div>${items.map(i=>navLink(...i)).join('')}<div class="sidefoot"><strong>Local prototype</strong><br>Records live in this browser only. This is not secure production authentication.</div></aside>`}
function heading(title,sub,actions=''){return `<div class="heading"><div><div class="eyebrow">${esc(portalNames[state.session.portal])}</div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}
function stat(label,value,hint=''){return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`}
function card(title,body,action=''){return `<section class="card"><div class="cardhead"><h2>${title}</h2>${action}</div>${body}</section>`}
function badge(s){let cls=['confirmed','completed','completed_on_time','resolved','active'].includes(s)?'green':['at_risk','pending','awaiting_confirmation','open','scheduled','requested','attempting'].includes(s)?'orange':['missed','failed','unresolved','cancelled','inactive','rejected'].includes(s)?'red':'blue';return `<span class="badge ${cls}">${esc((s||'—').replaceAll('_',' '))}</span>`}
function orgName(idv){return state.orgs.find(o=>o.id===idv)?.name||'Unknown organization'} function transName(idv){return state.transporters.find(t=>t.id===idv)?.name||'Unassigned'} function pickupRows(items,actions=true){if(!items.length)return `<tr><td colspan="7"><div class="empty">No pickups found. Add a pickup to start tracking reliability.</div></td></tr>`;return items.map(p=>`<tr><td><div class="primarytext">${esc(p.reference)}</div><div class="secondarytext">${esc(p.customer)}</div></td><td>${state.session.portal==='admin'?esc(orgName(p.orgId)):esc(p.description||'—')}</td><td>${esc(transName(p.transporterId))}</td><td>${moneylessTime(p.scheduledAt)}</td><td>${badge(p.commitment)}</td><td>${badge(p.operational)}</td><td>${actions?`<button class="secondary small" data-action="view-pickup" data-id="${p.id}">Open</button>`:'—'}</td></tr>`).join('')}
function pickupTable(items){return `<div class="tablewrap"><table><thead><tr><th>Pickup / customer</th><th>${state.session.portal==='admin'?'Organization':'Details'}</th><th>Transporter</th><th>Scheduled</th><th>Commitment</th><th>Operations</th><th></th></tr></thead><tbody>${pickupRows(items)}</tbody></table></div>`}
function getOrgPickups(){return state.pickups.filter(p=>p.orgId===state.session.orgId)}
function overview(){let p=state.session.portal;if(p==='admin'){let open=state.pickups.filter(x=>!['completed','cancelled'].includes(x.operational));return heading('Platform overview','Manage the Dispatch ecosystem from one local workspace. Create organizations, users, transporters and monitor pickup operations.',`<button data-action="new-org">+ Organization</button><button class="secondary" data-action="new-user">+ User</button>`)+`<div class="stats">${stat('Organizations',state.orgs.length,'Business workspaces')}${stat('Users',state.users.length,'Local identities')}${stat('Transporters',state.transporters.length,'Transporter records')}${stat('Open pickups',open.length,'Across the workspace')}</div><div class="grid">${card('Recent pickups',pickupTable(state.pickups.slice(0,5)))}${card('Ecosystem setup',`<p>Create and connect records in one place. All portals read from the same browser-local dataset.</p><div class="audit"><div class="auditrow"><strong>1. Create an organization</strong><small>Set up a manufacturer workspace.</small></div><div class="auditrow"><strong>2. Add users and roles</strong><small>Assign local demo identities to portals and organizations.</small></div><div class="auditrow"><strong>3. Add transporters</strong><small>Assign transporters to organizations.</small></div><div class="auditrow"><strong>4. Create and operate pickups</strong><small>Switch to Business or Transporter to update the same records.</small></div></div><div class="actions" style="margin-top:15px"><button data-action="new-org">Create organization</button><button class="secondary" data-action="new-transporter">Add transporter</button></div>`)}</div>`}
if(p==='business'){let ps=getOrgPickups();let late=ps.filter(x=>x.operational==='at_risk'||(x.scheduledAt&&new Date(x.scheduledAt)<new Date()&&!['completed','cancelled'].includes(x.operational)));return heading('Business overview',`Pickup reliability for ${esc(org()?.name||'your organization')}. Track commitments, spot risks and recover failed pickups.`,`<button data-action="new-pickup">+ Create pickup</button>`)+`<div class="stats">${stat('Total pickups',ps.length,'In this organization')}${stat('Awaiting confirmation',ps.filter(x=>['pending','awaiting_confirmation'].includes(x.commitment)).length,'Transporter response needed')}${stat('At risk',late.length,'Needs attention')}${stat('Completed',ps.filter(x=>x.operational==='completed').length,'Pickup completed')}</div><div class="grid">${card('Recent pickups',pickupTable(ps.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,7)),`<button class="secondary small" data-view="pickups">View all</button>`)}${card('Needs attention',attentionList(ps))}${card('Workflow',`<div class="audit"><div class="auditrow"><strong>1. Create</strong><small>Enter customer, goods, time window and transporter.</small></div><div class="auditrow"><strong>2. Confirm</strong><small>Transporter confirms or rejects the commitment.</small></div><div class="auditrow"><strong>3. Monitor</strong><small>Track operational state separately from commitment.</small></div><div class="auditrow"><strong>4. Recover</strong><small>Open a recovery case if the pickup fails.</small></div><div class="auditrow"><strong>5. Resolve and measure</strong><small>Record actual pickup outcome and review reports.</small></div></div>`)}</div>`}
let mine=state.pickups.filter(x=>x.transporterId===user().transporterId||x.orgId===state.session.orgId);return heading('Transporter overview','Review assigned pickups, respond to commitments, update progress and record exceptions.',`<button data-view="my-pickups">View assigned pickups</button>`)+`<div class="stats">${stat('Assigned',mine.length,'Visible to this local transporter identity')}${stat('Awaiting response',mine.filter(x=>x.commitment==='pending'||x.commitment==='awaiting_confirmation').length,'Confirm or reject')}${stat('In progress',mine.filter(x=>x.operational==='in_progress').length,'Currently being handled')}${stat('Exceptions',mine.filter(x=>['at_risk','recovery_in_progress','unresolved'].includes(x.operational)).length,'Needs an update')}</div><div class="grid">${card('Assigned pickups',pickupTable(mine.slice(0,8)))}${card('What to do next',`<div class="audit"><div class="auditrow"><strong>Confirm or reject</strong><small>Respond to a scheduled commitment.</small></div><div class="auditrow"><strong>Update progress</strong><small>Mark pickup in progress or completed.</small></div><div class="auditrow"><strong>Report an exception</strong><small>Explain delays and add a recovery note.</small></div></div>`)}</div>`}
function attentionList(ps){let items=ps.filter(p=>['at_risk','recovery_in_progress','unresolved'].includes(p.operational)||['open','attempting','failed'].includes(p.recovery)||p.commitment==='rejected');return items.length?`<div class="audit">${items.slice(0,6).map(p=>`<div class="auditrow"><strong>${esc(p.reference)} · ${esc(p.customer)}</strong><small>${badge(p.operational)} ${esc(p.notes||'Review pickup status')} <button class="secondary small" data-action="view-pickup" data-id="${p.id}">Open</button></small></div>`).join('')}</div>`:`<div class="empty">No active exceptions. Good.</div>`}
function listing(title,desc,items,createAction,headers){let filtered=items.filter(x=>{let blob=JSON.stringify(x).toLowerCase();return blob.includes(search.toLowerCase())&&(filter==='all'||x.status===filter||x.operational===filter||x.commitment===filter)});return heading(title,desc,createAction?`<button data-action="${createAction}">+ Create new</button>`:'')+`<div class="card"><div class="filterrow"><input id="searchBox" placeholder="Search records…" value="${esc(search)}"><select id="filterBox" style="max-width:210px"><option value="all">All statuses</option>${['active','inactive','pending','confirmed','rejected','scheduled','at_risk','in_progress','completed','cancelled','open','resolved'].map(s=>`<option value="${s}" ${filter===s?'selected':''}>${s.replaceAll('_',' ')}</option>`).join('')}</select></div>${headers(items,filtered)}</div>`}
function orgTable(items){return `<div class="tablewrap"><table><thead><tr><th>Organization</th><th>Code</th><th>Contact</th><th>Status</th><th>Pickups</th><th></th></tr></thead><tbody>${items.length?items.map(o=>`<tr><td><div class="primarytext">${esc(o.name)}</div><div class="secondarytext">${esc(o.id)}</div></td><td>${esc(o.code||'—')}</td><td>${esc(o.contact||'—')}</td><td>${badge(o.status)}</td><td>${state.pickups.filter(p=>p.orgId===o.id).length}</td><td><button class="secondary small" data-action="edit-org" data-id="${o.id}">Edit</button> <button class="secondary small" data-action="new-user" data-org="${o.id}">Add user</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">No organizations yet. Create the first business workspace.</div></td></tr>`}</tbody></table></div>`}
function usersTable(items){return `<div class="tablewrap"><table><thead><tr><th>User</th><th>Role</th><th>Organization / transporter</th><th>Status</th><th></th></tr></thead><tbody>${items.length?items.map(u=>`<tr><td><div class="primarytext">${esc(u.name)}</div><div class="secondarytext">${esc(u.email)}</div></td><td>${esc(roleNames[u.role]||u.role)}</td><td>${esc(u.orgId?orgName(u.orgId):u.transporterId?transName(u.transporterId):'Platform-wide')}</td><td>${badge(u.active?'active':'inactive')}</td><td><button class="secondary small" data-action="edit-user" data-id="${u.id}">Edit</button> <button class="${u.active?'danger':'secondary'} small" data-action="toggle-user" data-id="${u.id}">${u.active?'Deactivate':'Activate'}</button></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">No users found.</div></td></tr>`}</tbody></table></div>`}
function transTable(items){return `<div class="tablewrap"><table><thead><tr><th>Transporter</th><th>Contact</th><th>Organization</th><th>Status</th><th>Assigned pickups</th><th></th></tr></thead><tbody>${items.length?items.map(t=>`<tr><td><div class="primarytext">${esc(t.name)}</div><div class="secondarytext">${esc(t.email||'')}</div></td><td>${esc(t.contactName||'—')}<div class="secondarytext">${esc(t.phone||'')}</div></td><td>${esc(orgName(t.orgId))}</td><td>${badge(t.status)}</td><td>${state.pickups.filter(p=>p.transporterId===t.id).length}</td><td><button class="secondary small" data-action="edit-transporter" data-id="${t.id}">Edit</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">No transporters yet. Add a transporter to assign pickups.</div></td></tr>`}</tbody></table></div>`}
function renderView(){let p=state.session.portal;if(view==='overview')return overview();if(view==='organizations'&&p==='admin')return listing('Organizations','Create and manage manufacturer workspaces.',state.orgs,'new-org',(_,items)=>orgTable(items));if(view==='users'&&p==='admin')return listing('Users & access','Create local identities and assign their portal role. These are demo roles, not secure authentication.',state.users,'new-user',(_,items)=>usersTable(items));if(view==='transporters')return listing('Transporters',p==='admin'?'Manage transporter records across organizations.':'Manage the transporters associated with your organization.',state.transporters.filter(t=>p==='admin'||t.orgId===state.session.orgId),'new-transporter',(_,items)=>transTable(items));if(view==='pickups'&&(p==='admin'||p==='business')){let items=state.pickups.filter(x=>p==='admin'||x.orgId===state.session.orgId);return listing(p==='admin'?'All pickups':'Pickups',p==='admin'?'Review pickup activity across the local ecosystem.':'Create and manage pickup commitments and outcomes.',items,'new-pickup',(_,f)=>pickupTable(f))}if(view==='my-pickups'&&p==='transporter'){let items=state.pickups.filter(x=>x.transporterId===user().transporterId||x.orgId===state.session.orgId);return listing('Assigned pickups','Respond to commitments and update pickup progress.',items,null,(_,f)=>pickupTable(f))}if((view==='recovery'||view==='exceptions')&&(p==='business'||p==='transporter')){let items=state.pickups.filter(x=>(p==='business'?x.orgId===state.session.orgId:(x.transporterId===user().transporterId||x.orgId===state.session.orgId))&&(['at_risk','recovery_in_progress','unresolved'].includes(x.operational)||!['not_required','resolved','closed_unresolved'].includes(x.recovery)));return heading(p==='business'?'Recovery desk':'Exceptions','Investigate and resolve pickup failures without erasing the original history.',`<button class="secondary" data-view="pickups">All pickups</button>`)+card('Open recovery cases',pickupTable(items))}if(view==='reports'&&p==='business'){let ps=getOrgPickups(),completed=ps.filter(x=>x.outcome==='completed_on_time').length,late=ps.filter(x=>x.outcome==='completed_late').length,missed=ps.filter(x=>x.outcome==='missed').length,known=completed+late+missed;return heading('Reports','A transparent view of known pickup outcomes. Pending or unknown outcomes are not counted as success.')+`<div class="stats">${stat('On-time',completed,known?Math.round(completed/known*100)+'% of known outcomes':'No known outcomes yet')}${stat('Late',late,'Completed after window')}${stat('Missed',missed,'Confirmed missed pickups')}${stat('Unknown / pending',ps.filter(x=>['pending','unresolved'].includes(x.outcome)).length,'Excluded from success rate')}</div>`+card('Pickup outcomes',`<div class="tablewrap"><table><thead><tr><th>Reference</th><th>Customer</th><th>Outcome</th><th>Actual pickup</th><th>Scheduled</th></tr></thead><tbody>${ps.length?ps.map(x=>`<tr><td>${esc(x.reference)}</td><td>${esc(x.customer)}</td><td>${badge(x.outcome)}</td><td>${moneylessTime(x.actualPickupAt)}</td><td>${moneylessTime(x.scheduledAt)}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">No pickups yet.</div></td></tr>'}</tbody></table></div>`)}if(view==='audit'&&p==='admin')return heading('Activity log','Recent changes made in this browser workspace.')+card('Audit events',`<div class="audit">${state.audit.map(a=>`<div class="auditrow"><strong>${esc(a.action)}</strong><small>${esc(a.actor)} · ${fmt(a.at)} ${a.details?' · '+esc(a.details):''}</small></div>`).join('')}</div>`);if(view==='settings')return heading('Workspace settings','Manage the local dataset and move records in or out of this browser.')+`<div class="grid">${card('Export backup',`<p>Download all current organizations, users, transporters, pickups and activity as a JSON backup.</p><button data-action="export">Download JSON backup</button>`)}${card('Import backup',`<p>Restore a previously exported Dispatch local backup. Import replaces the current browser dataset.</p><input type="file" id="importFile" accept="application/json"><div class="formactions"><button class="danger" data-action="import">Import and replace</button></div>`)}${card('Reset demo workspace',`<p>Restore the original demo dataset. This permanently replaces the current data in this browser.</p><button class="danger" data-action="reset">Reset local data</button>`)}</div>`;return heading('Dispatch','Choose a portal from the navigation.');}
function render(){if(!state.session||!state.users.some(u=>u.id===state.session.userId&&u.active)){showLanding();return}let p=state.session.portal;document.querySelector('#app').innerHTML=header()+`<div class="layout">${sidebar()}<main class="main">${renderView()}<div class="footnote">Dispatch local ecosystem · ${state.users.length} users · ${state.orgs.length} organizations · Data saved in this browser's localStorage.</div></main></div>`;document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;search='';filter='all';render()}));document.querySelector('#portalSwitch').addEventListener('change',e=>{loginPortal=e.target.value;showLogin()});document.querySelector('#exportBtn').addEventListener('click',exportData);document.querySelector('#logoutBtn').addEventListener('click',logout);document.querySelector('#searchBox')?.addEventListener('input',e=>{search=e.target.value;const pos=e.target.selectionStart;render();const el=document.querySelector('#searchBox');el?.focus();el?.setSelectionRange(pos,pos)});document.querySelector('#filterBox')?.addEventListener('change',e=>{filter=e.target.value;render()});document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action,b.dataset.id,b.dataset.org)));}
function openModal(title,body,onSave,saveLabel='Save'){document.querySelector('#modalroot').innerHTML=`<div class="modalback"><section class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" data-close>✕</button></div><form id="modalForm">${body}<div class="formactions"><button type="button" class="secondary" data-close>Cancel</button><button type="submit">${saveLabel}</button></div></form></section></div>`;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);document.querySelector('.modalback').addEventListener('click',e=>{if(e.target.classList.contains('modalback'))closeModal()});document.querySelector('#modalForm').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());if(onSave(data)!==false){closeModal();save();render()}})}function closeModal(){document.querySelector('#modalroot').innerHTML=''}function field(name,label,value='',type='text',required=false,opts=null,full=false){let ctrl=opts?`<select name="${name}" ${required?'required':''}>${opts.map(o=>`<option value="${esc(o.value)}" ${o.value===value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" value="${esc(value??'')}" ${required?'required':''}>`;return `<div class="field ${full?'full':''}"><label>${label}</label>${ctrl}</div>`}
function action(a,idv,orgid){if(a==='new-org'||a==='edit-org'){let o=state.orgs.find(x=>x.id===idv)||{};openModal(a==='new-org'?'Create organization':'Edit organization',`<div class="formgrid">${field('name','Organization name',o.name,'text',true)}${field('code','Short code',o.code||'','text',true)}${field('contact','Contact email',o.contact||'','email')}${field('status','Status',o.status||'active','text',true,[{value:'active',label:'Active'},{value:'inactive',label:'Inactive'}])}</div>`,d=>{if(state.orgs.some(x=>x.code.toLowerCase()===d.code.toLowerCase()&&x.id!==idv)){toast('That organization code already exists.');return false}if(o.id)Object.assign(o,d);else state.orgs.push({id:id('org'),...d,createdAt:now()});log(o.id?'Updated organization':'Created organization',d.name);toast('Organization saved.')})}
else if(a==='new-user'||a==='edit-user'){let u=state.users.find(x=>x.id===idv)||{};let roles=[{value:'platform_admin',label:'Platform administrator'},{value:'business_owner',label:'Factory owner'},{value:'business_operator',label:'Business operations'},{value:'transporter_operator',label:'Transporter operator'}];openModal(a==='new-user'?'Create local user':'Edit local user',`<div class="formgrid">${field('name','Full name',u.name||'','text',true)}${field('email','Email',u.email||'','email',true)}${field('role','Portal role',u.role||'business_owner','text',true,roles)}${field('orgId','Business organization',u.orgId||orgid||ORG_DEMO,'text',false,[{value:'',label:'No organization / platform-wide'},...state.orgs.map(o=>({value:o.id,label:o.name}))])}${field('transporterId','Transporter assignment',u.transporterId||'','text',false,[{value:'',label:'None'},...state.transporters.map(t=>({value:t.id,label:t.name}))])}${field('active','Account status',String(u.active!==false),'text',true,[{value:'true',label:'Active'},{value:'false',label:'Inactive'}])}${field('demoPassword','Local demo password',u.demoPassword||'','text',!u.id)}</div><p class="muted">Local prototype only. New users must use a unique demo password. This is not secure production authentication.</p>`,d=>{if(state.users.some(x=>x.email.toLowerCase()===d.email.toLowerCase()&&x.id!==idv)){toast('That email is already in use.');return false}let row={id:u.id||id('u'),name:d.name,email:d.email.toLowerCase(),role:d.role,orgId:d.orgId||null,transporterId:d.transporterId||null,active:d.active==='true',demoPassword:d.demoPassword||u.demoPassword||'',createdAt:u.createdAt||now()};if(u.id)Object.assign(u,row);else state.users.push(row);log(u.id?'Updated local user':'Created local user',row.email+' · '+roleNames[row.role]);toast('User saved.')})}
else if(a==='toggle-user'){let u=state.users.find(x=>x.id===idv);if(u){u.active=!u.active;log(u.active?'Activated local user':'Deactivated local user',u.email);save();render();toast('User status updated.')}}
else if(a==='new-transporter'||a==='edit-transporter'){let t=state.transporters.find(x=>x.id===idv)||{};openModal(a==='new-transporter'?'Add transporter':'Edit transporter',`<div class="formgrid">${field('name','Transporter company / name',t.name||'','text',true)}${field('orgId','Organization',t.orgId||state.session.orgId||ORG_DEMO,'text',true,state.orgs.map(o=>({value:o.id,label:o.name})))}${field('contactName','Contact person',t.contactName||'')}${field('email','Contact email',t.email||'','email')}${field('phone','Phone',t.phone||'')}${field('status','Status',t.status||'active','text',true,[{value:'active',label:'Active'},{value:'inactive',label:'Inactive'}])}</div>`,d=>{let row={id:t.id||id('t'),...d,createdAt:t.createdAt||now()};if(t.id)Object.assign(t,row);else state.transporters.push(row);log(t.id?'Updated transporter':'Created transporter',row.name);toast('Transporter saved.')})}
else if(a==='new-pickup'){if(!state.orgs.length){toast('Create an organization first.');return}openModal('Create pickup',`<div class="formgrid">${field('customer','Customer / destination', '','text',true)}${field('description','Goods / shipment description','','text',true)}${field('orgId','Business organization',state.session.portal==='admin'?(state.orgs[0]?.id||''):state.session.orgId,'text',true,state.orgs.map(o=>({value:o.id,label:o.name})))}${field('transporterId','Assign transporter','','text',false,[{value:'',label:'Unassigned'},...state.transporters.filter(t=>t.status==='active').map(t=>({value:t.id,label:t.name}))])}${field('pickupAddress','Pickup address','','text',true)}${field('deliveryAddress','Delivery address','','text',true)}${field('scheduledAt','Scheduled pickup',dateInput(new Date(Date.now()+3600000)),'datetime-local',true)}${field('windowEnd','Pickup window ends',dateInput(new Date(Date.now()+7200000)),'datetime-local',true)}${field('notes','Notes','','text',false,null,true)}</div>`,d=>{let n=state.pickups.length+1;let p={id:id('p'),reference:'DSP-'+String(n).padStart(4,'0'),customer:d.customer,description:d.description,orgId:d.orgId,pickupAddress:d.pickupAddress,deliveryAddress:d.deliveryAddress,transporterId:d.transporterId||null,scheduledAt:new Date(d.scheduledAt).toISOString(),windowEnd:new Date(d.windowEnd).toISOString(),commitment:'pending',operational:'awaiting_confirmation',recovery:'not_required',outcome:'pending',actualPickupAt:null,notes:d.notes||'',createdAt:now(),updatedAt:now(),events:[{at:now(),by:user().name,type:'created',text:'Pickup created'}]};state.pickups.unshift(p);log('Created pickup',p.reference);toast('Pickup created.')})}
else if(a==='view-pickup'){let p=state.pickups.find(x=>x.id===idv);if(!p)return;openPickup(p)}
else if(a==='export')exportData();else if(a==='import'){const file=document.querySelector('#importFile')?.files?.[0];if(!file){toast('Choose a JSON backup first.');return}file.text().then(t=>{try{const d=JSON.parse(t);if(!d.users||!d.orgs||!d.pickups||!d.transporters)throw Error('Backup missing required collections');if(confirm('Replace all current local data with this backup?')){state=d;save();render();toast('Backup imported.')}}catch(e){toast('Import failed: '+e.message)}})}else if(a==='reset'){if(confirm('Reset the local workspace? This replaces all current data in this browser.')){state=initial();view='overview';save();render();toast('Demo workspace reset.')}}}
function openPickup(p){let isTrans=state.session.portal==='transporter', isAdmin=state.session.portal==='admin';let statuses=['requested','awaiting_confirmation','scheduled','at_risk','recovery_in_progress','in_progress','completed','cancelled','unresolved'];let recovery=['not_required','open','attempting','replacement_confirmed','resolved','failed','closed_unresolved'];let outcome=['pending','completed_on_time','completed_late','missed','cancelled','unresolved'];let canEdit=!isTrans;let body=`<div class="formgrid"><div class="field"><label>Reference</label><input value="${esc(p.reference)}" disabled></div><div class="field"><label>Customer</label><input value="${esc(p.customer)}" disabled></div><div class="field"><label>Organization</label><input value="${esc(orgName(p.orgId))}" disabled></div><div class="field"><label>Transporter</label><input value="${esc(transName(p.transporterId))}" disabled></div><div class="field"><label>Commitment</label><div>${badge(p.commitment)}</div></div><div class="field"><label>Operational state</label><div>${badge(p.operational)}</div></div><div class="field"><label>Recovery</label><div>${badge(p.recovery)}</div></div><div class="field"><label>Outcome</label><div>${badge(p.outcome)}</div></div><div class="field full"><label>Pickup → delivery</label><p>${esc(p.pickupAddress)} → ${esc(p.deliveryAddress)}</p><p>${esc(p.description)}</p></div><div class="field"><label>Scheduled</label><p>${fmt(p.scheduledAt)}</p></div><div class="field"><label>Window ends</label><p>${fmt(p.windowEnd)}</p></div><div class="field full"><label>Notes</label><textarea id="pickupNotes">${esc(p.notes||'')}</textarea></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Actions</h3><div class="actions" style="margin:10px 0 15px">${p.commitment!=='confirmed'&&!isAdmin?'<button type="button" data-paction="confirm">Confirm commitment</button>':''}${p.commitment!=='rejected'&&!isAdmin?'<button type="button" class="danger" data-paction="reject">Reject commitment</button>':''}${!['completed','cancelled'].includes(p.operational)?'<button type="button" class="secondary" data-paction="progress">Mark in progress</button><button type="button" data-paction="complete">Complete pickup</button>':''}<button type="button" class="secondary" data-paction="risk">Mark at risk</button><button type="button" class="secondary" data-paction="recovery">Open recovery</button></div><div class="formgrid"><div class="field"><label>Operational state</label><select id="opState">${statuses.map(s=>`<option value="${s}" ${s===p.operational?'selected':''}>${s.replaceAll('_',' ')}</option>`).join('')}</select></div><div class="field"><label>Recovery state</label><select id="recState">${recovery.map(s=>`<option value="${s}" ${s===p.recovery?'selected':''}>${s.replaceAll('_',' ')}</option>`).join('')}</select></div><div class="field"><label>Final outcome</label><select id="outState">${outcome.map(s=>`<option value="${s}" ${s===p.outcome?'selected':''}>${s.replaceAll('_',' ')}</option>`).join('')}</select></div><div class="field"><label>Actual pickup time (when completed)</label><input id="actualTime" type="datetime-local" value="${p.actualPickupAt?dateInput(new Date(p.actualPickupAt)):''}"></div></div><div class="formactions"><button type="button" class="secondary" data-paction="save">Save updates</button></div><h3 style="margin-top:22px">History</h3><div class="audit">${(p.events||[]).slice().reverse().map(e=>`<div class="auditrow"><strong>${esc(e.text)}</strong><small>${esc(e.by)} · ${fmt(e.at)}</small></div>`).join('')}</div>`;openModal(`Pickup ${esc(p.reference)}`,body,()=>true,'Close');document.querySelector('#modalForm .formactions button[type="submit"]').classList.add('hidden');document.querySelectorAll('[data-paction]').forEach(b=>b.addEventListener('click',()=>updatePickup(p.id,b.dataset.paction)));}
function updatePickup(pid,action){let p=state.pickups.find(x=>x.id===pid);if(!p)return;let note=document.querySelector('#pickupNotes')?.value||p.notes;let text='';if(action==='confirm'){p.commitment='confirmed';p.operational=p.operational==='awaiting_confirmation'?'scheduled':p.operational;text='Transporter confirmed commitment'}else if(action==='reject'){p.commitment='rejected';p.operational='at_risk';p.recovery='open';text='Transporter rejected commitment; recovery opened'}else if(action==='progress'){p.operational='in_progress';p.commitment='confirmed';text='Pickup marked in progress'}else if(action==='complete'){p.operational='completed';p.commitment='confirmed';p.actualPickupAt=document.querySelector('#actualTime')?.value?new Date(document.querySelector('#actualTime').value).toISOString():now();p.outcome=new Date(p.actualPickupAt)<=new Date(p.windowEnd)?'completed_on_time':'completed_late';if(p.recovery==='open'||p.recovery==='attempting'||p.recovery==='replacement_confirmed')p.recovery='resolved';text='Pickup completed; outcome recorded'}else if(action==='risk'){p.operational='at_risk';p.recovery='open';p.outcome='pending';text='Pickup marked at risk; recovery opened'}else if(action==='recovery'){p.operational='recovery_in_progress';p.recovery='open';text='Recovery case opened'}else{p.operational=document.querySelector('#opState').value;p.recovery=document.querySelector('#recState').value;p.outcome=document.querySelector('#outState').value;let actual=document.querySelector('#actualTime').value;if(actual)p.actualPickupAt=new Date(actual).toISOString();if(p.operational==='completed'&&!p.actualPickupAt)p.actualPickupAt=now();if(p.operational==='completed'&&p.outcome==='pending')p.outcome=new Date(p.actualPickupAt)<=new Date(p.windowEnd)?'completed_on_time':'completed_late';text='Pickup details updated'}p.notes=note;p.updatedAt=now();p.events=p.events||[];p.events.push({at:now(),by:user().name,type:action,text});log('Updated pickup',p.reference+' · '+text);save();openPickup(p);toast('Pickup updated.')}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dispatch-local-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);log('Exported local backup');toast('Backup downloaded.')}
// Initial persistence + render. Login session is tab-scoped and must be established through the portal login screen.
if(!localStorage.getItem(KEY))save();state.session=null;render();window.addEventListener('load',()=>setTimeout(()=>document.querySelector('#dispatchLoader')?.classList.add('done'),520));setTimeout(()=>document.querySelector('#dispatchLoader')?.classList.add('done'),1800);
})();
</script></body></html>
